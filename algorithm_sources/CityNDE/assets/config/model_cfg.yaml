MODEL:
    CONTEXT_ENCODER:
        NAME: RouteTLEnhancedEncoder

        NUM_OF_ATTN_NEIGHBORS: 32
        NUM_INPUT_ATTR_AGENT: 23
        NUM_INPUT_ATTR_MAP: 9
        NUM_INPUT_ATTR_TL: 16 
        NUM_CHANNEL_IN_MLP_AGENT: 256
        NUM_CHANNEL_IN_MLP_MAP: 64
        NUM_LAYER_IN_MLP_AGENT: 3
        NUM_LAYER_IN_MLP_MAP: 5
        NUM_LAYER_IN_PRE_MLP_MAP: 3

        D_MODEL: 256
        NUM_ATTN_LAYERS: 6
        NUM_ATTN_HEAD: 8 
        DROPOUT_OF_ATTN: 0.1 

        USE_LOCAL_ATTN: True

    MOTION_DECODER:
        NAME: RouteTLSmoothEnhancedDecoder

        CENTER_OFFSET_OF_MAP: [0.0, 0]

        NUM_FUTURE_FRAMES: 80
        NUM_MOTION_MODES: 6

        INTENTION_POINTS_FILE: assets/intention_priors/nuplan-boston-cluster-64-past-011-future-080-timeinterval-0.100000.pkl

        D_MODEL: 512
        NUM_DECODER_LAYERS: 6 
        NUM_ATTN_HEAD: 8
        MAP_D_MODEL: 256
        DROPOUT_OF_ATTN: 0.1 

        NUM_BASE_MAP_POLYLINES: 256
        NUM_WAYPOINT_MAP_POLYLINES: 128

        LOSS_WEIGHTS: {
            'cls': 1.0,
            'heading': 20.0,
            'reg': 1.0, 
            'vel': 0.5
        }

        NMS_DIST_THRESH: 2.5


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 10
    NUM_EPOCHS: 30

    OPTIMIZER: AdamW
    LR: 0.0001
    WEIGHT_DECAY: 0.01

    SCHEDULER: lambdaLR
    DECAY_STEP_LIST: [22, 24, 26, 28]
    LR_DECAY: 0.5
    LR_CLIP: 0.000001

    GRAD_NORM_CLIP: 1000.0
